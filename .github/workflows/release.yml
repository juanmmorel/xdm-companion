name: Release XDM Companion

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Validar la versión del tag antes de iniciar la compilación
        run: python3 scripts/release.py check "$GITHUB_REF_NAME"

  check-windows-installer:
    needs: validate-release-tag
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Validar sintaxis de PowerShell
        shell: pwsh
        run: |
          $files = @("scripts/install.ps1", "scripts/uninstall.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

  release:
    needs: [validate-release-tag, check-windows-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar Node para las pruebas del puente
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de verificación
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: |
          bash -n scripts/install.sh scripts/package-release.sh
          python -m pytest -q -p no:cacheprovider
          node integration_tests/browser_bridge.test.js

      - name: Crear los paquetes reproducibles de Linux y Windows
        run: scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Verificar los paquetes antes de publicarlos
        run: |
          cd "dist/release/$GITHUB_REF_NAME"
          sha256sum --check --strict \
            xdm-companion-linux.tar.gz.sha256 \
            xdm-companion-windows.zip.sha256
          python3 - <<'PY'
          import json
          import pathlib
          import tarfile
          import zipfile

          required = {
              "installer/install.py",
              "installer/uninstall.py",
              "core/domains.json",
              "requirements.txt",
              "browser-bridge/manifest.json",
              "browser-bridge/site-config.js",
              "browser-bridge/chrome-unpacked/manifest.json",
          }
          with tarfile.open("xdm-companion-linux.tar.gz", "r:gz") as archive:
              linux_files = {
                  pathlib.PurePosixPath(name).as_posix()
                  for name in archive.getnames()
              }
              linux_files = {name.removeprefix("./") for name in linux_files}
              if not required.issubset(linux_files):
                  raise SystemExit(f"Paquete Linux incompleto: {sorted(required - linux_files)}")
              manifest_member = next(
                  item for item in archive.getmembers()
                  if item.name.removeprefix("./") == "browser-bridge/chrome-unpacked/manifest.json"
              )
              linux_manifest = json.load(archive.extractfile(manifest_member))
          with zipfile.ZipFile("xdm-companion-windows.zip") as archive:
              windows_files = set(archive.namelist())
              if not required.issubset(windows_files):
                  raise SystemExit(f"Paquete Windows incompleto: {sorted(required - windows_files)}")
              windows_manifest = json.loads(
                  archive.read("browser-bridge/chrome-unpacked/manifest.json")
              )
          if linux_manifest.get("manifest_version") != 3 or windows_manifest.get("manifest_version") != 3:
              raise SystemExit("El puente local de Chrome requiere Manifest V3.")
          if linux_manifest.get("version") != windows_manifest.get("version"):
              raise SystemExit("Las versiones del puente de Chrome no coinciden entre paquetes.")
          with tarfile.open("xdm-companion-linux.tar.gz", "r:gz") as archive:
              root_manifest_member = next(
                  item for item in archive.getmembers()
                  if item.name.removeprefix("./") == "browser-bridge/manifest.json"
              )
              linux_root_manifest = json.load(archive.extractfile(root_manifest_member))
          with zipfile.ZipFile("xdm-companion-windows.zip") as archive:
              windows_root_manifest = json.loads(archive.read("browser-bridge/manifest.json"))
          if any(
              manifest.get("version") != linux_manifest.get("version")
              for manifest in (linux_root_manifest, windows_root_manifest)
          ):
              raise SystemExit("El manifiesto de Chrome en la carpeta browser-bridge no coincide.")
          print(f"Paquetes verificados; puente local de Chrome {linux_manifest['version']} incluido.")
          PY

      - name: Publicar la release y sus checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/$GITHUB_REF_NAME/xdm-companion-linux.tar.gz" \
            "dist/release/$GITHUB_REF_NAME/xdm-companion-linux.tar.gz.sha256" \
            "dist/release/$GITHUB_REF_NAME/xdm-companion-windows.zip" \
            "dist/release/$GITHUB_REF_NAME/xdm-companion-windows.zip.sha256" \
            --title "XDM Companion $GITHUB_REF_NAME" \
            --generate-notes
