name: Validate release package before tagging

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar Node para las pruebas del puente
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de verificación
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar las pruebas
        run: |
          bash -n scripts/install.sh scripts/package-release.sh
          python -m pytest -q -p no:cacheprovider
          node integration_tests/browser_bridge.test.js

      - name: Construir y verificar los paquetes de la próxima release
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("browser-bridge/manifest.chrome.json"))["version"])')"
          TAG="v${VERSION}"
          OUTPUT_DIR="${RUNNER_TEMP}/xdm-companion-release-check"
          bash scripts/package-release.sh "$TAG" "$OUTPUT_DIR"
          (
            cd "$OUTPUT_DIR/$TAG"
            sha256sum --check --strict \
              xdm-companion-linux.tar.gz.sha256 \
              xdm-companion-windows.zip.sha256
          )
          python - "$OUTPUT_DIR/$TAG/xdm-companion-linux.tar.gz" \
            "$OUTPUT_DIR/$TAG/xdm-companion-windows.zip" <<'PY'
          import pathlib
          import sys
          import tarfile
          import zipfile

          linux_archive, windows_archive = map(pathlib.Path, sys.argv[1:])
          required = {"installer/install.py", "installer/uninstall.py", "core/domains.json", "requirements.txt"}
          with tarfile.open(linux_archive, "r:gz") as archive:
            linux_files = {str(pathlib.PurePosixPath(name)) for name in archive.getnames()}
          with zipfile.ZipFile(windows_archive) as archive:
            windows_files = set(archive.namelist())
          if not required.issubset(linux_files):
            raise SystemExit(f"Paquete Linux incompleto: {sorted(required - linux_files)}")
          if not required.issubset(windows_files):
            raise SystemExit(f"Paquete Windows incompleto: {sorted(required - windows_files)}")
          PY
